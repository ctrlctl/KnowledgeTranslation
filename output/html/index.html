const topics=[...new Set(articles.flatMap(a=>a.tp))].sort();
const pubSel=document.getElementById('pub');
const topicSel=document.getElementById('topic');
pubs.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=pubNames[p]||p;pubSel.appendChild(o)});
topics.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;topicSel.appendChild(o)});

function render(){
  const p=pubSel.value,t=topicSel.value;
  const filtered=articles.filter(a=>(!p||a.p===p)&&(!t||a.tp.includes(t)));
  document.getElementById('count').textContent=`共 ${filtered.length} 篇`;
  document.getElementById('list').innerHTML=filtered.map(a=>{
    const dateStr=a.d.slice(0,4)+'-'+a.d.slice(4,6)+'-'+a.d.slice(6,8);
    const tags=a.tp.map(x=>`<span class="tag">${x}</span>`).join('');
    return `<a class="item" href="${a.f}"><div class="item-title">${a.t}</div><div class="item-meta"><span>${pubNames[a.p]||a.p}</span><span>${dateStr}</span>${tags}</div></a>`;
  }).join('');
}
pubSel.onchange=topicSel.onchange=render;

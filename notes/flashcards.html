<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent 知识卡片</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Serif SC', Georgia, serif;
  background: #faf8f5;

h1 { font-size: 20px; margin-bottom: 0.5em; }
.stats { font-size: 13px; color: #888; margin-bottom: 1.5em; }
.card {
  width: 100%;
  max-width: 560px;
  min-height: 200px;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  padding: 2em;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.card-label {
  font-size: 12px;
  color: #a0220d;
  font-weight: bold;
  margin-bottom: 0.8em;
}
.card-question {
  font-size: 17px;
  line-height: 1.9;
  margin-bottom: 1.2em;
}
.card-hint {
  font-size: 13px;
  color: #999;
  margin-bottom: 1em;
}
.input-area {
  width: 100%;
  max-width: 560px;
  margin-top: 1em;
}
.input-area textarea {

}

  margin-top: 0.8em;

  font-size: 14px;
  background: #a0220d;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
}
.submit-btn:hover { opacity: 0.85; }
.answer-box {
  width: 100%;
  max-width: 560px;
  margin-top: 1.2em;
  background: #f5f5f0;
  border-radius: 10px;
  padding: 1.5em;
  display: none;
}
.answer-label {
  font-size: 12px;
  color: #1a6b42;
  font-weight: bold;
  margin-bottom: 0.6em;
}
.answer-content {
  font-size: 15px;

}

  margin-bottom: 0.4em;
}

  line-height: 1.7;

  gap: 1em;

  font-family: inherit;

.btn-forgot { background: #f0e0dc; color: #a0220d; }

  margin-bottom: 1em;

.filter-btn {

  border: 1px solid #ddd;

.manage {

  max-width: 560px;

.manage summary { font-size: 13px; color: #888; cursor: pointer; }
.manage-btns { display: flex; gap: 0.5em; flex-wrap: wrap; margin-top: 0.5em; }
.manage-btns button {
  font-size: 12px;
  padding: 0.4em 0.8em;

<body>

<h1>Agent 知识卡片</h1>
<div class="filters" id="filters"></div>
<div class="stats" id="stats"></div>

<div class="card" id="card">
  <div class="card-label">问题</div>
  <div class="card-question" id="question"></div>
  <div class="card-hint" id="hint"></div>
</div>

<div class="input-area" id="inputArea">
  <textarea id="userInput" placeholder="输入你记得的关键词..."></textarea>
  <button class="submit-btn" onclick="submit()">提交看答案</button>
</div>

<div class="answer-box" id="answerBox">
  <div class="answer-label">正确答案</div>
  <div class="answer-content" id="answerContent"></div>
  <div class="your-answer">

  </div>
  <div class="source-text" id="sourceText"></div>
  <div id="historyArea"></div>
</div>

<div class="buttons" id="buttons">
  <button class="btn-forgot" onclick="answer(false)">没想起来 ✗</button>
  <button class="btn-got" onclick="answer(true)">记住了 ✓</button>
</div>

<details class="manage">
  <summary>管理</summary>
  <div class="manage-btns">
    <button onclick="exportData()">导出备份</button>
    <button onclick="document.getElementById('importFile').click()">导入</button>

</details>

const STORAGE_KEY = 'agent_flashcards_v2';
const HISTORY_KEY = 'agent_flashcards_history';
const API_BASE = 'https://flashcards.lqita507.workers.dev';
const AUTH_TOKEN = '233996';

async function loadFromCloud() {
  try {
    const res = await fetch(API_BASE + '/api/load');
    const data = await res.json();
    if (data && data.weights) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data.weights));
      if (data.history) localStorage.setItem(HISTORY_KEY, JSON.stringify(data.history));
      return data;
    }
  } catch(e) { console.log('Cloud load failed, using local'); }
  return null;
}

async function saveToCloud() {
  try {
    await fetch(API_BASE + '/api/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + AUTH_TOKEN },
      body: JSON.stringify({ weights, history })
    });
  } catch(e) { console.log('Cloud save failed'); }
}

function loadWeights() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) return JSON.parse(saved);
  return CARDS.map(() => 0);
}
function saveWeights() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(weights));
  saveToCloud();
}

function loadHistory() {
  const saved = localStorage.getItem(HISTORY_KEY);
  if (saved) return JSON.parse(saved);
  return {};
}
function saveHistory() {
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}

let weights = loadWeights();
while (weights.length < CARDS.length) weights.push(0);
let history = loadHistory();

// 启动时从云端同步
loadFromCloud().then(data => {
  if (data && data.weights) {
    weights = data.weights;
    while (weights.length < CARDS.length) weights.push(0);
    if (data.history) history = data.history;
    buildQueue(); updateStats(); showCard();
  }
});

let queue = [];
let currentIdx = -1;
let activeFilter = null; // null = 全部
let filterType = 'source'; // 'source' or 'topic'

function getSources() {
  return [...new Set(CARDS.map(c => c.source))];
}

function getTopics() {
  return [...new Set(CARDS.map(c => c.topic))];
}

function renderFilters() {
  const sources = getSources();
  const topics = getTopics();
  let html = '<button class="filter-btn active" onclick="setFilter(null)">全部</button>';
  html += '<span style="color:#ccc;margin:0 0.3em;">|</span>';
  topics.forEach(t => {
    html += `<button class="filter-btn" onclick="setFilter('${t}','topic')">${t}</button>`;
  });
  html += '<span style="color:#ccc;margin:0 0.3em;">|</span>';
  sources.forEach(s => {
    const label = s.replace(/^[^_]+_\d+_/, '');
    html += `<button class="filter-btn" onclick="setFilter('${s}','source')">${label}</button>`;
  });
  document.getElementById('filters').innerHTML = html;
}

function setFilter(value, type) {
  activeFilter = value;
  filterType = type || 'source';
  document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
  // 高亮当前按钮
  document.querySelectorAll('.filter-btn').forEach(btn => {
    if (!value && btn.textContent === '全部') btn.classList.add('active');
    else if (btn.getAttribute('onclick') && btn.getAttribute('onclick').includes(`'${value}'`)) btn.classList.add('active');
  });
  buildQueue();
  updateStats();
  showCard();
}

function buildQueue() {
  queue = CARDS.map((_, i) => i);
  if (activeFilter) {
    if (filterType === 'topic') {
      queue = queue.filter(i => CARDS[i].topic === activeFilter);
    } else {
      queue = queue.filter(i => CARDS[i].source === activeFilter);
    }
  }
  queue.sort((a, b) => {
    if (weights[b] !== weights[a]) return weights[b] - weights[a];
    return Math.random() - 0.5;
  });
}

function updateStats() {
  let pool = CARDS.map((_, i) => i);
  if (activeFilter) {
    if (filterType === 'topic') {
      pool = pool.filter(i => CARDS[i].topic === activeFilter);
    } else {
      pool = pool.filter(i => CARDS[i].source === activeFilter);
    }
  }
  const total = pool.length;
  const mastered = pool.filter(i => weights[i] <= -2).length;
  const struggling = pool.filter(i => weights[i] >= 2).length;
  document.getElementById('stats').textContent =
    `共 ${total} 张 \u00b7 已掌握 ${mastered} \u00b7 需加强 ${struggling}`;
}

function showCard() {
  if (queue.length === 0) {
    document.getElementById('card').innerHTML = '<div class="done">\ud83c\udf89 本轮复习完成！刷新页面开始新一轮。</div>';
    document.getElementById('inputArea').style.display = 'none';
    document.getElementById('answerBox').style.display = 'none';
    document.getElementById('buttons').style.display = 'none';
    return;
  }
  currentIdx = queue.shift();
  document.getElementById('question').textContent = CARDS[currentIdx].q;
  document.getElementById('hint').textContent = '\ud83d\udca1 ' + CARDS[currentIdx].hint;
  document.getElementById('inputArea').style.display = 'block';
  document.getElementById('answerBox').style.display = 'none';
  document.getElementById('buttons').style.display = 'none';
  document.getElementById('userInput').value = '';
  document.getElementById('userInput').focus();
}

function submit() {
  const userText = document.getElementById('userInput').value.trim();
  if (!userText) {
    document.getElementById('userInput').placeholder = '至少写几个关键词再提交...';
    return;
  }
  // 记录历史
  const key = String(currentIdx);
  if (!history[key]) history[key] = [];
  history[key].push({ text: userText, time: new Date().toLocaleString('zh-CN') });
  saveHistory();

  document.getElementById('inputArea').style.display = 'none';
  document.getElementById('answerBox').style.display = 'block';
  document.getElementById('answerContent').innerHTML = CARDS[currentIdx].a.replace(/\n/g, '<br>');
  document.getElementById('yourAnswer').textContent = userText;

  // 显示历史记录
  const histList = history[key];
  let histHtml = '';
  if (histList.length > 1) {
    histHtml = '<div style="margin-top:0.8em;padding-top:0.8em;border-top:1px solid #e0e0e0;font-size:12px;color:#999;">\u5386\u53f2\u56de\u7b54\uff1a';
    for (let i = histList.length - 2; i >= Math.max(0, histList.length - 4); i--) {
      histHtml += '<div style="margin-top:0.3em;color:#777;">' + histList[i].time + '\uff1a' + histList[i].text.replace(/</g,'&lt;') + '</div>';
    }
    histHtml += '</div>';
  }
  document.getElementById('historyArea').innerHTML = histHtml;

  document.getElementById('sourceText').textContent = '\u6765\u6e90\uff1a' + CARDS[currentIdx].source;
  document.getElementById('buttons').style.display = 'flex';
}

function answer(got) {
  if (got) {
    weights[currentIdx] = Math.max(weights[currentIdx] - 1, -3);
  } else {
    weights[currentIdx] = Math.min(weights[currentIdx] + 1, 5);
  }
  saveWeights();
  updateStats();
  showCard();
}

// 快捷键：Enter提交，← →评分
document.addEventListener('keydown', (e) => {
  if (e.code === 'Enter' && !e.shiftKey && document.getElementById('inputArea').style.display !== 'none') {
    e.preventDefault();
    submit();
  }
  if (document.getElementById('buttons').style.display === 'flex') {
    if (e.code === 'ArrowLeft') answer(false);
    if (e.code === 'ArrowRight') answer(true);
  }
});

function resetWeights() {
  if (confirm('\u786e\u5b9a\u91cd\u7f6e\u6240\u6709\u6743\u91cd\uff1f')) {
    weights = CARDS.map(() => 0);
    saveWeights(); buildQueue(); updateStats(); showCard();
  }
}
function exportData() {
  const blob = new Blob([JSON.stringify({ cards: CARDS, weights }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'flashcards_backup.json'; a.click();
}
function importData(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const data = JSON.parse(e.target.result);
    if (data.weights) { weights = data.weights; while (weights.length < CARDS.length) weights.push(0); saveWeights(); buildQueue(); updateStats(); showCard(); }
  };
  reader.readAsText(file);
}

buildQueue(); updateStats(); showCard(); renderFilters();
</script>
</body>
</html>
